version: "3.7"
services:
  redis:
    image: redis:latest
    container_name: redis
    command: >
      redis-server 
      --replicaof no one
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    ports:
      - 6379:6379
    volumes:
      - .docker-conf/redis/data:/data
    restart: always

  video-touch-api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: video-touch-api
    depends_on:
      - redis
    env_file: .env
    environment:
      - PORT=$API_PORT
    ports:
      - $API_PORT:$API_PORT
      - ./uploads:$TEMP_UPLOAD_DIRECTORY
    restart: always

  download-video-worker:
    build:
      context: workers/download-video-worker
      dockerfile: Dockerfile
    container_name: download-video-worker
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - DOWNLOAD_VIDEO_WORKER_PORT=$DOWNLOAD_VIDEO_WORKER_PORT
    restart: always
  validate-video-worker:
    build:
      context: workers/validate-video-worker
      dockerfile: Dockerfile
    container_name: validate-video-worker
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - VALIDATE_VIDEO_WORKER_PORT=$VALIDATE_VIDEO_WORKER_PORT
    restart: always

  thumbnail-generation-worker:
    build:
      context: workers/thumbnail-generation-worker
      dockerfile: Dockerfile
    container_name: thumbnail-generation-worker
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - THUMBNAIL_WORKER_PORT=$THUMBNAIL_WORKER_PORT
    restart: always

  # One container per height in TRANSCODE_HEIGHTS (default 720,540,480).
  process-video-worker-540p:
    build:
      context: workers/process-video-worker
      dockerfile: Dockerfile
    container_name: process-video-worker-540p
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - PROCESS_VIDEO_WORKER_PORT=$PROCESS_VIDEO_WORKER_PORT
      - BULL_PROCESS_VIDEO_JOB_QUEUE=$BULL_540P_PROCESS_VIDEO_JOB_QUEUE
      - WORKER_ROLE=transcode
    cpuset: "0-3"
    restart: always


  process-video-worker-480p:
    build:
      context: workers/process-video-worker
      dockerfile: Dockerfile
    container_name: process-video-worker-480p
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - PROCESS_VIDEO_WORKER_PORT=$PROCESS_VIDEO_WORKER_PORT
      - BULL_PROCESS_VIDEO_JOB_QUEUE=$BULL_480P_PROCESS_VIDEO_JOB_QUEUE
      - WORKER_ROLE=transcode
    cpuset: "4-7"
    restart: always

  process-video-worker-720p:
    build:
      context: workers/process-video-worker
      dockerfile: Dockerfile
    container_name: process-video-worker-720p
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - PROCESS_VIDEO_WORKER_PORT=$PROCESS_VIDEO_WORKER_PORT
      - BULL_PROCESS_VIDEO_JOB_QUEUE=$BULL_720P_PROCESS_VIDEO_JOB_QUEUE
      - WORKER_ROLE=transcode
    cpuset: "8-11"
    restart: always

  # Only gets jobs when TRANSCODE_HEIGHTS includes 1080.
  process-video-worker-1080p:
    build:
      context: workers/process-video-worker
      dockerfile: Dockerfile
    container_name: process-video-worker-1080p
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - PROCESS_VIDEO_WORKER_PORT=$PROCESS_VIDEO_WORKER_PORT
      - BULL_PROCESS_VIDEO_JOB_QUEUE=$BULL_1080P_PROCESS_VIDEO_JOB_QUEUE
      - WORKER_ROLE=transcode
    cpuset: "12-15"
    restart: always

  # Builds the downloadable MP4s (download-file-generation queue).
  process-video-worker-mp4:
    build:
      context: workers/process-video-worker
      dockerfile: Dockerfile
    container_name: process-video-worker-mp4
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - PROCESS_VIDEO_WORKER_PORT=$PROCESS_VIDEO_WORKER_PORT
      # Required by the worker's config; the mp4 role doesn't consume it.
      - BULL_PROCESS_VIDEO_JOB_QUEUE=$BULL_720P_PROCESS_VIDEO_JOB_QUEUE
      - WORKER_ROLE=mp4
    cpuset: "12-15"
    restart: always

  audio-worker:
    build:
      context: workers/audio-worker
      dockerfile: Dockerfile
    container_name: audio-worker
    env_file: .env
    depends_on:
      - video-touch-api
    environment:
      - AUDIO_WORKER_PORT=$AUDIO_WORKER_PORT
    cpuset: "12-15"
    restart: always


  upload-video-worker:
    build:
      context: workers/upload-video-worker
      dockerfile: Dockerfile
    container_name: upload-video-worker
    env_file: .env
    depends_on:
      - video-touch-api
      - redis
    environment:
      - UPLOAD_VIDEO_WORKER_PORT=$UPLOAD_VIDEO_WORKER_PORT
    restart: always
